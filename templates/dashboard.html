<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ANALISIS WEB</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: #0d6efd; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-login { 
            border-radius: 12px; 
            width: 100%;
            max-width: 380px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="card card-login p-4 bg-white">
        <h3 class="text-center fw-bold mb-4 text-primary">ANALISIS WEB</h3>
        
        {% if error %}
            <div class="alert alert-danger py-2 text-center" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Ej: DICKSON" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
