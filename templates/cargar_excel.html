<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargar Excel - ANALISIS WEB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-sm" style="max-width: 450px; width: 100%;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Cargar Archivo</h5>
            <span class="badge bg-secondary">Usuario: {{ usuario }}</span>
        </div>
        {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form action="/cargar" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <input class="form-control" type="file" name="file" accept=".xlsx, .xls" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Procesar Dashboard</button>
        </form>
        <div class="text-center mt-3">
            <a href="/logout" class="text-muted small">Cerrar Sesión</a>
        </div>
    </div>
</body>
</html>
