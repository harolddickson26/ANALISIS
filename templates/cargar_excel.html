<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let chartMeses = null;

const ctxMeses = document.getElementById('chartMeses').getContext('2d');

// Datos iniciales desde Flask
const initialLabelsMes = {{ labels_mes|tojson }};
const initialValoresMes = {{ valores_mes|tojson }};

function renderChartMeses(labels, data) {
    if (chartMeses) chartMeses.destroy();

    chartMeses = new Chart(ctxMeses, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Ventas ($)',
                data: data,
                borderColor: '#6f42c1',
                backgroundColor: 'rgba(111, 66, 193, 0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 4
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
}

// Cargar gráfico inicial
if (initialLabelsMes.length > 0) {
    renderChartMeses(initialLabelsMes, initialValoresMes);
}

// Actualizar gráfico en cada cambio de filtro
document.querySelectorAll('#selectEstacion, #selectAnio, #selectProducto').forEach(select => {
    select.addEventListener('change', function() {
        fetch('/api/filtrar-analisis', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                estacion: document.getElementById('selectEstacion').value,
                anio: document.getElementById('selectAnio').value,
                producto: document.getElementById('selectProducto').value
            })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('kpiTotal').innerText = data.kpi_total;
            document.getElementById('kpiRemisiones').innerText = data.kpi_remisiones;
            document.getElementById('kpiPromedio').innerText = data.kpi_promedio;

            renderChartMeses(data.labels_mes, data.valores_mes);
        });
    });
});
</script>
