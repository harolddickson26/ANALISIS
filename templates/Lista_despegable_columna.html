<!-- SECCIÓN CONFIGURABLE DE KPIS Y MÉTRICAS DINÁMICAS -->
<div class="card p-4 mb-4 border-0 shadow-sm rounded-3">
    <h5 class="fw-bold text-dark mb-3">⚙️ Configuración de KPIs y Métricas</h5>
    
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label fw-bold">1. Selecciona la Métrica Principal / KPI 1 (Suma):</label>
            <select name="col_kpi_1" class="form-select" required>
                <option value="">-- Columna Numérica (ej. Ventas, Monto, Costo) --</option>
                {% for col in columnas %}
                <option value="{{ col }}">{{ col }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-bold">2. Selecciona la Métrica Secundaria / KPI 2 (Suma/Cantidad):</label>
            <select name="col_kpi_2" class="form-select">
                <option value="">-- Opcional (ej. Galones, Cantidad, Horas) --</option>
                {% for col in columnas %}
                <option value="{{ col }}">{{ col }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label fw-bold">3. Dimension / Categoría Principal (Eje X / Grupos):</label>
            <select name="col_categoria_1" class="form-select" required>
                <option value="">-- Columna de Agrupación (ej. Sucursal, Vendedor, Cliente) --</option>
                {% for col in columnas %}
                <option value="{{ col }}">{{ col }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-bold">4. Dimensión Temporal (Fecha para tendencia):</label>
            <select name="col_fecha" class="form-select">
                <option value="">-- Opcional (ej. Fecha, Mes, Periodo) --</option>
                {% for col in columnas %}
                <option value="{{ col }}">{{ col }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
</div>
