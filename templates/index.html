<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 40px 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 25px 0;
        }
        .btn-menu {
            background-color: #3498db;
            color: white;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .btn-menu:hover { background-color: #2980b9; }
        .btn-logout {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .btn-logout:hover { background-color: #c0392b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Bienvenida, {{usuario}}!</h1>
        <h1>!Diana Paulina Eres un encanto de mujer!</h>



        <p>Selecciona una opción del sistema:</p>
        
        <div class="grid-menu">
            <a href="/inventario" class="btn-menu">📦 Inventario</a>
            <a href="/ingresar-entrada" class="btn-menu">📥 Ingresar Entrada</a>
            <a href="/ingresar-venta" class="btn-menu">🛒 Ingresar Venta</a>
            <a href="/utilidad" class="btn-menu">📊 Utilidad</a>
            <a href="/total-ventas" class="btn-menu">💰 Total Ventas</a>
            <a href="/total-entradas" class="btn-menu">📋 Total Entradas</a>
        </div>
        
        <a href="/logout" class="btn-logout">Cerrar Sesión</a>
    </div>
</body>
</html>
