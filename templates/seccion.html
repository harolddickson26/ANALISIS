<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; max-width: 500px; width: 100%; }
        h1 { color: #2c3e50; }
        p { color: #555; font-size: 16px; margin-bottom: 25px; }
        .btn-back { background-color: #7f8c8d; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; }
        .btn-back:hover { background-color: #95a5a6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ titulo }}</h1>
        <p>{{ contenido }}</p>
        <a href="/" class="btn-back">⬅ Volver al Menú Principal</a>
    </div>
</body>
</html>
