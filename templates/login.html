<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - ANALISIS WEB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d6efd; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-login { border-radius: 12px; width: 380px; }
    </style>
</head>
<body>
    <div class="card card-login p-4 shadow-lg bg-white">
        <h3 class="text-center font-weight-bold mb-4 text-primary">ANALISIS WEB</h3>
        {% if error %}
            <div class="alert alert-danger py-2 text-center">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label font-weight-bold">Usuario</label>
                <input type="text" name="usuario" class="form-control" placeholder="Ej: DICKSON" required>
            </div>
            <div class="mb-3">
                <label class="form-label font-weight-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 font-weight-bold">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
